[package]
name = "FederatedFrankingImpl"
version = "0.1.0"
edition = "2021"

[dependencies]
signature = "2.0"
subtle = "2.6"
serde = "1.0.219"
aes-gcm = "0.10.3"
bincode = "1.3.3"
hmac = "0.12.1"
digest = "0.10.7"
rand_core = "0.5"
sha2 = "0.10"
curve25519-dalek = { version = "4.1.3", features = ['precomputed-tables', 'alloc', 'zeroize', 'rand_core', 'digest', 'group'] }
rand = "0.8.5"
sha3 = "0.10.8"
generic-array = "1.0.0"
lazy_static = "1.4.0"
crypto_box = { version = "0.9.1", features = ["seal"] }
typenum = "1.17.0"
criterion = { version = "0.4.0", features = ["html_reports"] }
clap = { version = "4.5.27", features = ["derive"] }
ff = "0.13.0"
group = "0.13.0"
rand_chacha = { version = "0.9.0", features = ["os_rng"] }
getrandom = "0.3"
ed25519-dalek = {version = "2", features = ["rand_core"]}

[dev-dependencies]
criterion = "0.5"